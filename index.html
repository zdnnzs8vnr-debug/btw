 faq:{e:'MODULE 03 // DOCUMENTATION',t:'FAQ & SECURITY',d:'How the system works, operating protocols, guarantees and shipping info.',tag:'DOCS OK',
  sec:'SECURE CONNECTION',secS:'End-to-end encryption active // No logs stored',prot:'SECURITY PROTOCOLS',
  protList:['End-to-end encrypted channels','No personal data retention','Anonymous crypto transactions','Offshore servers in secure jurisdictions'],
  q1:['How does shipping work?','All packages ship in stealth mode with anonymous packaging: the outer box carries no reference to its contents. We use reliable couriers and provide tracking on Telegram. Average times: EU 48–72h, non-EU 5–7 days.'],
  q2:['Do you accept anonymous payments?','Yes. We accept cryptocurrencies: they are the fastest method and guarantee total anonymity. No bank data, no name, no traceability back to you.'],
  q3:['How does the PayPal top-up work?','After payment, funds are transferred to your PayPal within 1–4 hours via Friends and Family. No visible fees and the balance is immediately available and withdrawable.'],
  q4:['Do the banknotes pass inspections?','Yes. All material is Grade AAA+ and passes the counterfeit pen test, the UV lamp and the tactile cotton-fiber check. Practically indistinguishable from the originals.'],
  q5:['What if the package is seized?','With documented customs issues (photo of the seizure) we arrange free reshipping or a full refund. Thanks to anti-Xray packaging the success rate is above 98%.'],
  q6:['Is my data safe?','We store no personal data. Telegram chats are encrypted and logs are deleted every 24 hours. We never ask for documents or identifying information.'],
  q7:['Can I place recurring orders?','Absolutely. Regular clients get dedicated discounts and priority on new stock. After your third completed order you automatically join the VIP program.'],
  q8:['Are you reliable? Have you disappeared before?','We have been operating since 2022 and took more than one hit: each time we were back online within days, stronger than before. We keep stock, tracking and an always-active Telegram channel — if anything changes, you will hear it there first.']},

  sec:'CONEXIÓN SEGURA',secS:'Cifrado de extremo a extremo activo // Sin logs',prot:'PROTOCOLOS DE SEGURIDAD',

  q1:['¿Cómo funciona el envío?','Todos los paquetes viajan en modo stealth con embalaje anónimo: la caja exterior no lleva ninguna referencia al contenido. Usamos mensajerías fiables y damos seguimiento en Telegram. Tiempos medios: UE 48–72h, fuera de la UE 5–7 días.'],
  q2:['¿Aceptáis pagos anónimos?','Sí. Aceptamos criptomonedas: son el método más rápido y garantizan anonimato total. Sin datos bancarios, sin nombre, sin trazabilidad hacia ti.'],
  q3:['¿Cómo funciona la recarga de PayPal?','Tras el pago, los fondos se transfieren a tu PayPal en 1–4 horas vía Amigos y Familia. Sin comisiones visibles y saldo disponible y retirable de inmediato.'],
  q4:['¿Los billetes pasan los controles?','Sí. Todo el material es Grade AAA+ y supera el test del bolígrafo antifalsificación, la lámpara UV y el control táctil de la fibra de algodón. Prácticamente indistinguibles.'],
  q5:['¿Y si incautan el paquete?','Con problemas aduaneros documentados (foto de la incautación) hacemos reenvío gratuito o reembolso completo. Gracias al embalaje anti-Xray la tasa de éxito supera el 98%.'],
  q6:['¿Mis datos están seguros?','No conservamos datos personales. Los chats de Telegram están cifrados y los logs se borran cada 24 horas. Nunca pedimos documentos ni información identificativa.'],
  q7:['¿Puedo hacer pedidos recurrentes?','Por supuesto. Los clientes habituales tienen descuentos dedicados y prioridad en el nuevo stock. Tras tu tercer pedido completado entras automáticamente en el programa VIP.'],
  q8:['¿Sois fiables? ¿Habéis desaparecido antes?','Operamos desde 2022 y hemos encajado más de un golpe: cada vez volvimos online en pocos días, más sólidos que antes. Tenemos stock, seguimiento y un canal de Telegram siempre activo — si algo cambia, lo sabrás ahí primero.']},

  q3:['Wie funktioniert die PayPal-Aufladung?','Nach der Zahlung gehen die Mittel innerhalb von 1–4 Stunden per Freunde-und-Familie auf dein PayPal. Keine sichtbaren Gebühren, Guthaben sofort verfügbar.'],

  q5:['Was, wenn das Paket beschlagnahmt wird?','Bei dokumentierten Zollproblemen (Foto der Beschlagnahme) gibt es kostenlosen Neversand oder volle Rückerstattung. Dank Anti-Röntgen-Verpackung liegt die Erfolgsquote über 98 %.'],
  q6:['Sind meine Daten sicher?','Wir speichern keine persönlichen Daten. Telegram-Chats sind verschlüsselt, Logs werden alle 24 Stunden gelöscht. Nie Dokumente nötig.'],
  q7:['Kann ich regelmäßig bestellen?','Absolut. Stammkunden erhalten Rabatte und Vorrang bei neuem Bestand. Nach der dritten Bestellung bist du automatisch im VIP-Programm.'],
  q8:['Seid ihr zuverlässig? Wart ihr mal weg?','Wir sind seit 2022 aktiv und haben mehr als einen Treffer eingesteckt: jedes Mal waren wir in wenigen Tagen zurück, stärker als zuvor. Bestand, Tracking und ein immer aktiver Telegram-Kanal — Änderungen erfährst du dort zuerst.']},

        <div className="mt-3 space-y-2">{R.items.map((i,ix)=>(<div key={ix} className="flex justify-between border-b border-line/60 pb-2 text-sm"><span className="text-white/60">{i.name} × {i.qty}</span><span className="mono text-white">{money(i.unit*i.qty,lang)}</span></div>))}
          <div className="flex justify-between pt-2"><span className="mono text-xs uppercase tracking-widest text-white/50">{t('c.total')}</span><span className="mono text-lg text-cy">{money(R.total,lang)}</span></div>
        </div>
        <p className="mt-4 text-xs leading-relaxed text-white/45">{t('track.note')}</p>
        <a href={TG} target="_blank" rel="noreferrer" className="mt-4 block"><Btn cls="w-full">{t('checkout.ct')}</Btn></a>
      </Card>
    </div>}
    <p className="mono mt-4 text-[10px] tracking-widest text-white/25">{t('track.local')}</p>
  </div>);
}

/* ---- CHECKOUT ---- */
function Checkout(){
  const{t,lang,items,total,order,setOrder,tm,clear}=useApp();
  const[step,setStep]=useState(0),[sub,setSub]=useState(null),[code,setCode]=useState(''),[err,setErr]=useState('');
  const[left,setLeft]=useState(1800);
  const s=order.sh,p=order.pay;
  const setS=x=>setOrder(o=>({...o,sh:{...o.sh,...x}}));
  const setP=x=>setOrder(o=>({...o,pay:{...o.pay,...x}}));
  const hasCash=items.some(i=>!i.transfer), hasTr=items.some(i=>i.transfer);
  const fin=order.method==='bonifico'?total*1.1:order.method==='amazon'?total*1.2:total;
  useEffect(()=>{if(step!==2)return;const i=setInterval(()=>setLeft(v=>v>0?v-1:0),1000);return()=>clearInterval(i)},[step]);
  const mm=String(Math.floor(left/60)).padStart(2,'0'),ss=String(left%60).padStart(2,'0');
  const confirm=()=>{const c=makeCode(items);setCode(c);
    const msg=['🟣 ORDINE GUSTAVOEURO','',...items.map(i=>`• ${i.name} × ${i.qty} = ${money(i.unit*i.qty,lang)}`),'',`TOTALE ${money(fin,lang)}`,`METODO ${order.method}`,'',
      ...(hasCash?[`${s.addr} ${s.num}, ${s.zip} ${s.city}`,`${s.email} | ${s.pre} ${s.phone}`,`Corriere ${s.cour} ${s.locker}`]:[]),
      ...(hasTr?[`PAYPAL ${p.email}`]:[]),'',`CODICE ${c}`].join('\n');
    ordersAdd({code:c,items,total:fin,method:order.method,date:Date.now(),ship:s,pay:p});
    if(navigator.clipboard)navigator.clipboard.writeText(msg).catch(()=>{});setStep(3)};
  if(items.length===0&&step<3)return(<div className="mx-auto max-w-2xl px-4 pt-10 a-vi"><Back/><Card cls="mt-6 text-center"><p className="mono text-sm text-white/60">{t('c.empty')}</p><div className="mt-4 flex justify-center gap-2"><a href="#/cash"><Btn v="o">{t('nav.cash')}</Btn></a><a href="#/paypal"><Btn>{t('nav.paypal')}</Btn></a></div></Card></div>);
  const sm={'POSTE ITALIANE':'p','BRT':'b','GLS':'g','DHL':'d','LOCKER INPOST':'l'};
  const step0ok=()=>{
    if(hasTr){
      if(!p.email){setErr(t('checkout.pemailE'));return false}
      if(!isMail(p.email)){setErr(t('checkout.pemailBad'));return false}
      if(p.email.trim().toLowerCase()!==(p.email2||'').trim().toLowerCase()){setErr(t('checkout.pemailMatch'));return false}
    }
    if(hasCash){
      if(!s.addr||!s.num||!s.zip||!s.city||!s.email||!s.phone){setErr(t('checkout.fill'));return false}
      if(!s.cour){setErr(t('checkout.selcourier'));return false}
    }
    setErr('');return true;
  };
  return(<div className="mx-auto max-w-3xl px-4 pt-6 a-vi">
    <div className="mb-4 flex items-center justify-between"><Back to="/node"/><span className="mono flex items-center gap-1.5 text-[10px] tracking-[.2em] text-mt"><span className="h-1.5 w-1.5 rounded-full bg-mt pulse"/>{t('checkout.sec')}</span></div>
    <div className="mb-5 flex items-center gap-2">{t('checkout.steps').map((st,i)=>(
      <div key={st} className="flex flex-1 items-center gap-2">
        <div className={cx('flex h-6 w-6 items-center justify-center rounded-full mono text-[10px]',i<=step?'bg-vi text-black':'border border-line text-white/35')}>{i+1}</div>
        <span className={cx('mono hidden text-[9px] tracking-widest sm:inline',i<=step?'text-vi':'text-white/30')}>{st}</span>
        {i<3&&<div className={cx('h-px flex-1',i<step?'bg-vi/50':'bg-line')}/>}
      </div>))}</div>

    {step===0&&<div className="space-y-4">
      {hasTr&&<Card>
        <h2 className="font-bold text-white">{t('checkout.s1t')}</h2><p className="mono mt-1 text-[10px] tracking-widest text-white/40">{t('checkout.s1ts')}</p>
        <div className="mt-4 space-y-3">
          <div><label className="mono text-[10px] tracking-widest text-white/40">{t('checkout.pemail')}</label>
            <input className="inp mt-1" placeholder={t('checkout.pemph')} value={p.email} onChange={e=>setP({email:e.target.value})} autoComplete="email"/></div>
          <div><label className="mono text-[10px] tracking-widest text-white/40">{t('checkout.pemail2')}</label>
            <input className="inp mt-1" placeholder={t('checkout.pemph2')} value={p.email2} onChange={e=>setP({email2:e.target.value})} autoComplete="email"/></div>
        </div>
      </Card>}
      {hasCash&&<Card>
        <h2 className="font-bold text-white">{t('checkout.s1')}</h2><p className="mono mt-1 text-[10px] tracking-widest text-white/40">{t('checkout.s1s')}</p>
        <div className="mt-4 space-y-3">
          <div><label className="mono text-[10px] tracking-widest text-white/40">{t('checkout.addr')}</label>
            <div className="mt-1 grid grid-cols-3 gap-2"><input className="inp col-span-2" placeholder={t('checkout.street')} value={s.addr} onChange={e=>setS({addr:e.target.value})}/><input className="inp" placeholder={t('checkout.num')} value={s.num} onChange={e=>setS({num:e.target.value})}/></div></div>
          <div className="grid grid-cols-3 gap-2"><input className="inp" placeholder={t('checkout.zip')} value={s.zip} onChange={e=>setS({zip:e.target.value})}/><input className="inp col-span-2" placeholder={t('checkout.city')} value={s.city} onChange={e=>setS({city:e.target.value})}/></div>
          <div><label className="mono text-[10px] tracking-widest text-white/40">{t('checkout.cont')}</label>
            <div className="mt-1 space-y-2"><input className="inp" placeholder={t('checkout.email')} value={s.email} onChange={e=>setS({email:e.target.value})}/>
            <div className="flex gap-2"><select className="inp w-24" value={s.pre} onChange={e=>setS({pre:e.target.value})}>{PREFIXES.map(x=><option key={x}>{x}</option>)}</select><input className="inp" placeholder={t('checkout.phone')} value={s.phone} onChange={e=>setS({phone:e.target.value})}/></div></div></div>
          <div><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.cour')}</p>
            <div className="mt-2 grid gap-2 sm:grid-cols-2">{SHIPPERS.map(c=><button key={c} onClick={()=>setS({cour:c})} className={cx('rounded-lg border p-3 text-left transition-all',s.cour===c?'border-vi/70 bg-vi/10':'border-line hover:border-white/30')}><p className="mono text-xs text-white">{c}</p><p className="mono text-[9px] text-white/35">{t('checkout.sh.'+sm[c])[0]} · {t('checkout.sh.'+sm[c])[1]}</p></button>)}</div>
            {s.cour==='LOCKER INPOST'&&<input className="inp mt-2" placeholder={t('checkout.locker')} value={s.locker} onChange={e=>setS({locker:e.target.value})}/>}</div>
        </div>
      </Card>}
      {err&&<p className="mono text-xs text-rs">{err}</p>}
      <Btn cls="w-full" onClick={()=>{if(step0ok())setStep(1)}}>{t('checkout.go')}</Btn>
    </div>}

    {step===1&&<div className="space-y-4">
      <Card><p className="eyebrow">{t('checkout.sum')}</p>
        <div className="mt-3 space-y-2">{items.map(i=><div key={i.id} className="flex justify-between text-sm"><span className="text-white/60">{i.name} × {i.qty}</span><span className="mono text-white">{money(i.unit*i.qty,lang)}</span></div>)}</div>
        <div className="mt-3 flex justify-between border-t border-line pt-3"><span className="mono text-xs uppercase tracking-widest text-white/50">{t('checkout.tot')}</span><span className="mono text-lg text-vi">{money(total,lang)}</span></div></Card>
      {hasCash&&<Card><p className="eyebrow">{t('checkout.addr')}</p>
        <p className="mt-2 text-sm text-white/60">{s.addr} {s.num}, {s.zip} {s.city}</p>
        <p className="mono mt-1 text-xs text-white/45">{s.email} · {s.pre} {s.phone}</p>
        <p className="mono mt-1 text-xs text-white/45">{s.cour} {s.locker}</p></Card>}
      {hasTr&&<Card><p className="eyebrow">{t('checkout.pemail')}</p>
        <p className="mono mt-2 text-sm text-cy">{p.email}</p></Card>}
      <div className="flex gap-2"><Btn v="o" cls="flex-1" onClick={()=>setStep(0)}>{t('c.back')}</Btn><Btn cls="flex-1" onClick={()=>setStep(2)}>{t('checkout.go')}</Btn></div>
    </div>}

    {step===2&&<div className="space-y-4">
      <Card><h2 className="font-bold text-white">{t('checkout.s2')}</h2><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.sub2')}</p>
        <div className="mt-4 space-y-3">
          <button onClick={()=>{setOrder(o=>({...o,method:'crypto'}));setSub('cq')}} className={cx('w-full rounded-xl border p-4 text-left transition-all',order.method==='crypto'?'border-cy/70 bg-cy/10':'border-line hover:border-white/30')}>
            <div className="flex items-center justify-between"><span className="mono text-sm text-white">{t('checkout.crypto')}</span><span className="badge">{t('checkout.nofee')}</span></div>
            <p className="mono mt-1 text-[10px] text-white/40">{t('checkout.csub')}</p><p className="mono mt-1 text-[9px] text-cy">{t('checkout.cbadge')}</p>
            <p className="mt-2 text-[11px] text-white/45">{t('checkout.cpers')}</p></button>
          <button onClick={()=>{setOrder(o=>({...o,method:'bonifico'}));setSub('bon')}} className={cx('w-full rounded-xl border p-4 text-left transition-all',order.method==='bonifico'?'border-vi/70 bg-vi/10':'border-line hover:border-white/30')}>
            <div className="flex items-center justify-between"><span className="mono text-sm text-white">{t('checkout.bon')}</span><span className="badge">{t('checkout.bfee')}</span></div>
            <p className="mono mt-1 text-[10px] text-white/40">{t('checkout.bsub')}</p></button>
          <button onClick={()=>{setOrder(o=>({...o,method:'amazon'}));setSub('aq')}} className={cx('w-full rounded-xl border p-4 text-left transition-all',order.method==='amazon'?'border-gd/70 bg-gd/10':'border-line hover:border-white/30')}>
            <div className="flex items-center justify-between"><span className="mono text-sm text-white">{t('checkout.amz')}</span><span className="badge">{t('checkout.afee')}</span></div>
            <p className="mono mt-1 text-[10px] text-white/40">{t('checkout.asub')}</p></button>
        </div></Card>

      {sub==='cq'&&<Card><h3 className="font-bold text-white">{t('checkout.cq.0')}</h3><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.cq.1')}</p><div className="mt-3 flex gap-2"><Btn cls="flex-1" onClick={()=>setSub('conf')}>{t('checkout.cq.2')}</Btn><Btn v="o" cls="flex-1" onClick={()=>setSub('cg')}>{t('checkout.cq.3')}</Btn></div></Card>}
      {sub==='cg'&&<Card><h3 className="font-bold text-white">{t('checkout.cg.0')}</h3><ol className="mt-3 space-y-2">{t('checkout.cg').slice(1,5).map((x,i)=><li key={i} className="flex gap-2 text-sm text-white/60"><span className="mono text-cy">{i+1}.</span>{x}</li>)}</ol><Btn cls="mt-4 w-full" onClick={()=>setSub('conf')}>{t('checkout.cg.5')}</Btn></Card>}
      {sub==='aq'&&<Card><h3 className="font-bold text-white">{t('checkout.aq.0')}</h3><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.aq.1')}</p><div className="mt-3 flex gap-2"><Btn cls="flex-1" onClick={()=>setSub('conf')}>{t('checkout.aq.2')}</Btn><Btn v="o" cls="flex-1" onClick={()=>setSub('ag')}>{t('checkout.aq.3')}</Btn></div></Card>}
      {sub==='ag'&&<Card><h3 className="font-bold text-white">{t('checkout.ag.0')}</h3><p className="mt-2 text-sm text-white/55">{t('checkout.ag.1')}</p><p className="mono mt-2 text-[10px] text-gd">{t('checkout.ag.2')}</p><Btn cls="mt-4 w-full" onClick={()=>setSub('conf')}>{t('checkout.ag.3')}</Btn></Card>}
      {sub==='bon'&&<Card><h3 className="font-bold text-white">{t('checkout.bon')}</h3><p className="mt-2 text-sm text-white/55">{t('checkout.bfeeL')} · SEPA</p><p className="mt-2 text-xs text-white/45">{t('checkout.bonI')}</p><Btn cls="mt-4 w-full" onClick={()=>setSub('conf')}>OK</Btn></Card>}

      {sub==='conf'&&<Card>
        <div className="flex items-center justify-between"><h3 className="font-bold text-white">{t('checkout.conf')}</h3><span className="mono text-[10px] text-gd">{t('checkout.timeleft')} {mm}:{ss}</span></div>
        <p className="mono mt-1 text-[10px] tracking-widest text-white/40">{t('checkout.rate')}</p>
        {order.method==='crypto'&&<div className="mt-3"><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.net')}</p>
          <div className="mt-2 flex gap-2">{['USDT','BTC','LTC'].map(n=><button key={n} onClick={()=>setOrder(o=>({...o,coin:n}))} className={cx('flex-1 rounded-lg border p-3 mono text-xs',order.coin===n?'border-cy/70 bg-cy/10 text-cy':'border-line text-white/60')}>{n}</button>)}</div>
          {order.coin&&<div className="mt-3 rounded-lg border border-line bg-black/40 p-3">
            <p className="mono text-[9px] tracking-widest text-white/40">{t('checkout.addrw')} · {WALLETS[order.coin].net}</p>
            <p className="mono break-all text-xs text-cy">{WALLETS[order.coin].a}</p>
            <div className="mt-3 flex items-center gap-3">
              <img alt="QR" width="96" height="96" className="rounded-lg border border-line bg-white p-1" src={'https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=0&data='+encodeURIComponent(WALLETS[order.coin].a)}/>
              <div><p className="mono text-[9px] tracking-widest text-white/40">{t('checkout.send')}</p><p className="mono text-sm text-white">{WALLETS[order.coin].sym==='USDT'?(total*1.15).toFixed(2)+' USDT':money(total,lang)+' ('+WALLETS[order.coin].sym+')'}</p>
                <button onClick={async()=>{await cp(WALLETS[order.coin].a);tm(t('c.copied'))}} className="mono mt-2 text-[10px] uppercase tracking-widest text-white/45 hover:text-cy">{t('c.copy')}</button></div>
            </div>
            <p className="mt-3 text-[11px] leading-relaxed text-white/45">{t('checkout.cryptoI')}</p></div>}</div>}
        {order.method==='amazon'&&<div className="mt-3"><p className="mono text-[10px] tracking-widest text-white/40">CODICE BUONO</p><input className="inp mt-2" placeholder="XXXX-XXXX-XXXX-XXX" onChange={e=>setOrder(o=>({...o,voucher:e.target.value.toUpperCase()}))}/></div>}
        {order.method==='bonifico'&&<p className="mt-3 text-[11px] leading-relaxed text-white/45">{t('checkout.bonI')}</p>}
        <div className="mt-4 space-y-1 border-t border-line pt-3">
          <div className="flex justify-between text-sm"><span className="text-white/50">{t('checkout.sub')}</span><span className="mono text-white">{money(total,lang)}</span></div>
          {order.method==='bonifico'&&<div className="flex justify-between text-sm"><span className="text-white/50">{t('checkout.bfeeL')}</span><span className="mono text-white">+{money(total*.1,lang)}</span></div>}
          {order.method==='amazon'&&<div className="flex justify-between text-sm"><span className="text-white/50">{t('checkout.vfeeL')}</span><span className="mono text-white">+{money(total*.2,lang)}</span></div>}
          <div className="flex justify-between pt-2"><span className="mono text-xs uppercase tracking-widest text-white/50">{t('checkout.pay')}</span><span className="mono text-lg font-bold text-mt">{money(fin,lang)}</span></div>
        </div>
        <div className="mt-4 flex gap-2"><Btn v="o" cls="flex-1" onClick={()=>setStep(1)}>{t('c.back')}</Btn><Btn cls="flex-1" onClick={confirm}>{t('checkout.confirm')}</Btn></div>
      </Card>}
    </div>}

    {step===3&&<Card cls="relative text-center"><Brk/>
      <div className="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-mt/15 text-2xl text-mt">✓</div>
      <h1 className="text-xl font-bold text-white">{t('checkout.done')}</h1><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.doneS')}</p>
      <div className="mt-4 rounded-xl border border-mt/30 bg-mt/5 p-4"><p className="mono text-[10px] tracking-widest text-white/40">{t('checkout.code')}</p><p className="mono mt-1 text-2xl font-bold tracking-widest text-mt">{code}</p>
        <button onClick={async()=>{await cp(code);tm(t('c.copied'))}} className="mono mt-2 text-[10px] uppercase tracking-widest text-white/45 hover:text-mt">{t('checkout.cc')}</button></div>
      <p className="mono mt-4 text-[10px] tracking-widest text-white/40">{t('checkout.wait')}</p>
      {order.method==='amazon'&&<p className="mt-3 text-xs leading-relaxed text-white/50">{t('checkout.amzI')}</p>}
      {order.method==='bonifico'&&<p className="mt-3 text-xs leading-relaxed text-white/50">{t('checkout.bonI')}</p>}
      {order.method==='crypto'&&<p className="mt-3 text-xs leading-relaxed text-white/50">{t('checkout.cryptoI')}</p>}
      <div className="mt-4 rounded-xl border border-rs/30 bg-rs/5 p-4 text-left">
        <p className="mono text-[10px] tracking-widest text-rs">{t('checkout.failT')}</p>
        <p className="mt-2 text-xs leading-relaxed text-white/55">{t('checkout.fail')}</p>
      </div>
      <div className="mt-4 flex flex-wrap justify-center gap-2"><a href={TG} target="_blank" rel="noreferrer"><Btn>{t('checkout.ct')}</Btn></a><a href="#/track"><Btn v="o">{t('nav.track')}</Btn></a><Btn v="o" onClick={()=>{clear();nav('/node')}}>{t('checkout.back')}</Btn></div>
      <p className="mt-4 text-xs text-white/45">{t('checkout.warn')}</p>
    </Card>}
  </div>);
}

/* ================= APP ================= */
function Router(){
  const p=useRoute();const seg=p.split('/').filter(Boolean);const r=seg[0];
  if(!r)return <Boot/>;
  if(r==='gate')return <Gate/>;
  if(!sessionStorage.getItem('ge-in'))return <Gate/>;
  let page;
  if(r==='node')page=<Node_/>;
  else if(r==='cash')page=<Cash/>;
  else if(r==='paypal')page=<Paypal/>;
  else if(r==='quality')page=<Quality/>;
  else if(r==='feedback')page=<Feedback/>;
  else if(r==='faq')page=<Faq/>;
  else if(r==='track')page=<Track/>;
  else if(r==='privacy'||r==='terms'||r==='cookies')page=<Legal doc={r}/>;
  else if(r==='checkout')page=<Checkout/>;
  else page=<Node_/>;
  return(<><Header/>{page}<Footer/><Cart/></>);
}
function Toast(){const{toast}=useApp();if(!toast)return null;
  return <div className="pop fixed bottom-6 left-1/2 z-[100] -translate-x-1/2 rounded-full border border-vi/50 bg-surface/95 px-5 py-2.5 mono text-[11px] uppercase tracking-widest text-vi backdrop-blur-xl">{toast}</div>}
function Fab(){return <a href={TG} target="_blank" rel="noreferrer" aria-label="Telegram" className="fixed bottom-6 right-5 z-[80] flex h-12 w-12 items-center justify-center rounded-full bg-gradient-to-br from-vi to-cy text-black shadow-[0_10px_34px_-8px_rgba(157,107,255,.95)] transition-transform hover:scale-105"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.6 20c-.2 1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.4-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13.1 1.4 11.6c-1-.3-1-1 .2-1.5l19-7.3c.9-.3 1.6.2 1.3 1.5z"/></svg></a>}
function App(){return(<Prov><Router/><Toast/><Fab/></Prov>)}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
